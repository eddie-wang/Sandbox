node_id = "node-a"
# Safe foundation mode: no [native] enablement, so runtime admission stays disabled.
runtimes = ["runc_criu"]

[server]
listen = "127.0.0.1:8081"
max_in_flight = 64
request_timeout_ms = 5000
max_body_bytes = 16384

[auth]
env = "SANDBOX_WORKER_TOKEN"
# Alternatively use file = "secrets/worker-token" instead of env.
# Secret files are operator-managed and must not be committed.

# In this disabled configuration these are illustrative budgets, not measured usage.
# Native mode performs worker reservation and kernel enforcement; see worker.native.example.toml.
# In its [native] section, erofs_loop_fallback = false is the default; put native.root
# on a node-local disk filesystem such as xfs or ext4, not container overlay/tmpfs.
# Set erofs_loop_fallback = true only to opt into extra EROFS loop-device use.
# Optional native.network requires an operator-provisioned stable-MAC bridge/gateway.
# Use exactly one of addresses = ["198.18.0.10", ...] or slots = 32 (1..256).
# With slots, first_address = "198.18.0.10" is optional; default starts after gateway.
# Expansion stays in gateway/prefix, skips gateway/egress IPs, excludes network/broadcast,
# and rejects a range that runs out. Either pool must cover max_sandboxes; see docs/network.md.
# These numbers are unrelated to the unresolved capacity qualification budget.
[capacity]
memory_mib = 8192
vcpus = 4
max_sandboxes = 32
max_concurrent_restores = 2

# EXPERIMENTAL: explicit administrator enablement; no qualification claim.
# Provision root and an exclusive empty delegated cgroup-v2 parent first.
# No service action installs tools, loads modules, enables controllers or changes host sysctls. Opt-in network sysctls are slot/guest-local.
node_id = "node-a"
runtimes = ["runc_criu"]

[server]
listen = "127.0.0.1:8081"
max_in_flight = 64
request_timeout_ms = 5000
max_body_bytes = 16384
# App proxy bounds (defaults shown): open proxied exchanges and the idle timeout
# (the sender moves no byte, including the wait for the response head; a receiver
# that stops reading is not timed out). No total deadline.
# [server.proxy]
# max_connections = 256
# idle_timeout_ms = 600000
# Blocking requests wait for real outcomes. Defaults shown; a blocking exec waits
# for its timeout_ms plus margin_ms. Configure the same values on the controller.
# [server.operation_deadlines]
# create_ms = 120000
# capture_ms = 300000
# delete_ms = 120000
# margin_ms = 30000

[auth]
env = "SANDBOX_WORKER_TOKEN"

[capacity]
memory_mib = 192
vcpus = 1
max_sandboxes = 3
max_concurrent_restores = 1

[native]
enabled = true
root = "/var/lib/sandbox"
cgroup_parent = "/sys/fs/cgroup/sandbox"
# Optional existing administrator-staged tools; fixed basenames, never API paths.
# tools_dir = "/var/lib/sandbox-tools"
# Total admitted CPU quota <= capacity.vcpus * cpu_overcommit (1..16).
# This is a scheduling policy, not measured physical CPU use or a capacity result.
cpu_overcommit = 3
pids_max = 64                    # 16..65536, fixed across compatible templates
max_records = 128               # 1..100000, includes durable tombstones
max_concurrent_operations = 4  # 1..64 fixed threads; restore slots must fit
max_concurrent_execs = 64      # 1..1024 running commands per worker, own thread each
max_execs_per_sandbox = 8      # 1..64 running commands per sandbox, own cgroup each
# Results are returned inline and never stored. In-flight command output is at most
# max_concurrent_execs * max_output_bytes (1 MiB at most) bytes, plus JSON escaping.
max_artifact_bytes = 67108864   # 1 MiB..1 TiB per artifact, NOT a disk quota
command_timeout_seconds = 30   # 10..300, each host tool invocation

# Optional operator-provisioned network. Omit for fully isolated templates only.
# The bridge needs a stable explicitly assigned MAC and this gateway/prefix.
# Reserve unused addresses exclusively for this worker; at least max_sandboxes.
# The worker creates only owned veths/netns and slot-local routes/NAT/filter state.
# [native.network]
# bridge = "sandbox0"
# gateway = "198.18.0.1"
# prefix = 24
# addresses = ["198.18.0.10", "198.18.0.11", "198.18.0.12"]
# egress = [{ip = "198.51.100.20", port = 8443}]
# service_ports = [8080]   # app proxy reaches only template-approved ports of these

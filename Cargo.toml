[package]
name = "sandboxd"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
libc = "0.2"
sha2 = "0.10"
tokio = { version = "1.51.0", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "0.9.12"
